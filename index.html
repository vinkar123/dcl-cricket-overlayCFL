<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DCL Modern Live Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bat-primary:#0d4f9b;
  --bat-secondary:#062a61;
  --bat-text:#ffffff;
  --bowl-primary:#0d4f9b;
  --ink:#08172c;
  --muted:#41516b;
  --footer:#06172b;
  --gold:#f1b42c;
}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:transparent!important;
  font-family:"Roboto Condensed","Arial Narrow","Segoe UI",Arial,sans-serif
}
#brand{
  position:absolute;left:1vw;top:1vh;width:64px;height:64px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.94);border-radius:9px;padding:3px;
  box-sizing:border-box;filter:drop-shadow(0 2px 6px rgba(0,0,0,.24))
}
#brand img{width:100%;height:100%;object-fit:contain;border-radius:6px}

#overlay{
  position:absolute;left:1vw;right:1vw;bottom:1vh;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.40))
}
#err{
  display:none;margin-bottom:4px;background:#8b1e25;color:#fff;
  padding:6px 9px;border-radius:7px;font-size:13px;font-weight:900
}

/* Matches the approved compact broadcast layout */
.mainbar{
  height:84px;
  display:grid;
  grid-template-columns:34% 32% 34%;
  border:2px solid var(--bat-primary);
  border-bottom:none;
  border-radius:18px 18px 0 0;
  overflow:hidden;
  background:#fff
}

.batting-panel{
  position:relative;
  display:grid;
  grid-template-columns:82px minmax(0,1fr);
  align-items:center;
  gap:12px;
  padding:6px 24px 6px 14px;
  background:#fff;
  color:var(--ink);
  z-index:2
}
.batting-panel::after{
  content:"";
  position:absolute;
  right:-24px;top:0;
  width:48px;height:100%;
  background:#fff;
  transform:skewX(-15deg);
  border-right:2px solid var(--bat-primary);
  z-index:-1
}

.team-logo-big{
  width:56px;height:56px;border-radius:50%;
  object-fit:contain;background:#fff;
  border:1px solid #d7dfe8;padding:3px;box-sizing:border-box
}

.batting-lines{
  display:grid;
  grid-template-rows:1fr 1fr 1.1fr;
  gap:7px;
  min-width:0
}
.batter-line{
  display:flex;align-items:baseline;gap:7px;
  white-space:nowrap;min-width:0
}
.batter-name{
  letter-spacing:.1px;
  font-size:18px;
  font-weight:900;
  line-height:1;
  overflow:hidden;text-overflow:ellipsis
}
.batter-stat{
  font-size:15px;
  font-weight:900;
  color:var(--muted);
  white-space:nowrap
}
.team-name{
  letter-spacing:.15px;
  font-size:27px;
  font-weight:900;
  line-height:1;
  color:var(--bat-primary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}

/* Approved center proportions, but dynamic batting-team color */
.score-panel{
  display:grid;
  grid-template-columns:18% 49% 33%;
  align-items:center;
  padding:0 18px 0 26px;
  color:var(--bat-text);
  background:
    linear-gradient(105deg,var(--bat-primary) 0%,var(--bat-secondary) 58%,var(--bat-primary) 100%);
  position:relative;
  overflow:hidden
}
.score-panel::before{
  content:"";
  position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(255,255,255,.10),transparent 45%),
    repeating-linear-gradient(120deg,transparent 0 58px,rgba(255,255,255,.035) 58px 61px);
  pointer-events:none
}
.score-panel>*{position:relative;z-index:1}

.team-abbr{
  font-size:31px;
  font-weight:900;
  text-align:center;
  padding-right:10px;
  border-right:1px solid currentColor
}
.score-stack{text-align:center}
.main-score{
  font-family:"Roboto Condensed","Arial Narrow",Arial,sans-serif;
  font-size:49px;
  font-weight:900;
  line-height:.92;
  letter-spacing:-1px
}
.main-overs{
  font-size:20px;
  font-weight:900;
  margin-top:7px
}
.rate-stack{
  font-size:18px;
  font-weight:900;
  line-height:1.35;
  text-align:center;
  padding-left:13px;
  border-left:1px solid currentColor
}

/* Right side matches approved image. Team B name same size as Team A. */
.bowling-panel{
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  align-items:center;
  gap:12px;
  padding:6px 14px 6px 24px;
  background:#fff;
  border-left:2px solid var(--bowl-primary);
  border-top:2px solid var(--bowl-primary);
  border-right:2px solid var(--bowl-primary);
  color:var(--ink)
}
.bowling-copy{
  text-align:right;
  min-width:0
}
.bowler-line{
  font-size:17px;
  font-weight:900;
  line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.bowling-team-name{
  letter-spacing:.15px;
  margin-top:18px;
  font-size:27px;
  font-weight:900;
  line-height:1;
  color:var(--bowl-primary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}

/* Thin attached bottom ribbon */
.infobar{
  min-height:46px;
  display:grid;
  grid-template-columns:1.16fr 1.47fr 1.72fr .95fr;
  align-items:center;
  gap:12px;
  padding:6px 15px;
  border:2px solid var(--bat-primary);
  border-top:1px solid rgba(255,255,255,.08);
  border-radius:0 0 18px 18px;
  background:linear-gradient(90deg,#05162a,#071d37 50%,#05162a);
  color:#fff
}
#extrasInfo{
  padding:7px 11px;
  border-radius:6px;
  background:rgba(16,64,118,.40);
  border-left:4px solid var(--bat-primary);
  font-size:15px;
  font-weight:900;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
#partnershipInfo{
  padding:7px 11px;
  border-radius:6px;
  background:rgba(241,180,44,.14);
  border-left:4px solid var(--gold);
  font-size:15px;
  font-weight:900;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
#equation{
  text-align:center;
  font-size:16px;
  font-weight:900;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.info-right{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:6px;
  min-width:0;
  font-size:14px;
  font-weight:900;
  white-space:nowrap
}
.label{opacity:.78}
#balls{display:inline-flex;gap:3px}
.ball{
  min-width:24px;height:24px;padding:0 3px;border-radius:12px;
  display:inline-flex;align-items:center;justify-content:center;
  background:#edf2f7;color:#11243c;font-size:11px;font-weight:900
}
.ball.w{background:#d52f43;color:#fff}
.ball.boundary{background:#278fd0;color:#fff}
.ball.extra{background:#f1b42c;color:#17263a}

@media(max-width:900px){
  .mainbar{height:80px;grid-template-columns:34% 32% 34%}
  .batting-panel{grid-template-columns:72px minmax(0,1fr);padding:10px 17px 10px 10px}
  .team-logo-big{width:50px;height:50px}
  .batter-name{font-size:15px}
  .batter-stat{font-size:13px}
  .team-name,.bowling-team-name{font-size:23px}
  .team-abbr{font-size:27px}
  .main-score{font-size:42px}
  .main-overs{font-size:17px}
  .rate-stack{font-size:16px}
  .bowler-line{font-size:14px}
  .infobar{
    grid-template-columns:1.15fr 1.42fr 1.58fr .95fr;
    gap:7px;padding:5px 8px
  }
  #extrasInfo,#partnershipInfo{font-size:13px;padding:6px 7px}
  #equation{font-size:14px}
  .info-right{font-size:12px}
}
</style>
</head>

<script>
const qs = new URLSearchParams(location.search);
const matchId = (qs.get('match') || '5923').replace(/[^0-9]/g,'');
const refreshMs = Math.max(2000, Number(qs.get('refresh') || 2000));
const apiUrl = `/api/score?match=${matchId}`;

function deepFind(obj,key){
  if(!obj || typeof obj !== 'object') return undefined;
  if(Object.prototype.hasOwnProperty.call(obj,key)) return obj[key];
  for(const v of Object.values(obj)){
    const f=deepFind(v,key);
    if(f!==undefined) return f;
  }
}
function parseDetails(raw){
  if(!raw) return {};
  if(typeof raw === 'object') return raw;
  try{return JSON.parse(raw)}catch{return {}}
}
function cleanName(s){ return (s||'').replace(/\s+/g,' ').trim(); }
function abbrev(name){
  const words=cleanName(name).split(' ').filter(Boolean);
  if(words.length===1) return words[0].slice(0,3).toUpperCase();
  return words.map(w=>w[0]).join('').slice(0,4).toUpperCase();
}
function logoUrl(path){ return path ? `/api/score?logo=${encodeURIComponent(path)}` : ''; }
function ballClass(v){
  const s=String(v).toLowerCase();
  if(s.includes('w')) return 'ball w';
  if(s==='4'||s==='6') return 'ball boundary';
  if(/[a-z]/.test(s)) return 'ball extra';
  return 'ball';
}
function ballsRemaining(overs,maxOvers=20){
  const ov=Number(overs||0);
  const whole=Math.floor(ov);
  const balls=Math.round((ov-whole)*10);
  return Math.max(0,maxOvers*6-(whole*6+balls));
}
function latestMatchHost(payload){
  if(payload && typeof payload==='object' && 'score_details' in payload) return payload;
  if(!payload || typeof payload!=='object') return payload;
  for(const v of Object.values(payload)){
    const f=latestMatchHost(v);
    if(f) return f;
  }
  return payload;
}


function flattenEvents(inn){
  const out=[];
  const ev=inn?.events||{};
  for(const arr of Object.values(ev)){
    if(Array.isArray(arr)) for(const x of arr) out.push(x);
  }
  out.sort((a,b)=>new Date(a.stamp||0)-new Date(b.stamp||0));
  return out;
}
function isLegalBall(ev){
  if(ev?.isLegalDelivery===false) return false;
  const r=String(ev?.run??'').toLowerCase();
  if(r==='si'||r==='rt'||r.includes('wd')||r.includes('nb')) return false;
  return true;
}
function currentPartnership(inn){
  const events=flattenEvents(inn);
  const currentRuns=Number(inn?.runs||0);
  let lastWicketRuns=0, lastWicketTime=0;
  for(const ev of events){
    const run=String(ev?.run??'').toUpperCase();
    const score=String(ev?.score??'');
    if(run.includes('W')){
      const m=score.match(/^(\d+)\/(\d+)/);
      if(m) lastWicketRuns=Number(m[1]);
      lastWicketTime=new Date(ev.stamp||0).getTime();
    }
  }
  let balls=0;
  for(const ev of events){
    const t=new Date(ev.stamp||0).getTime();
    if(t>lastWicketTime && isLegalBall(ev)) balls++;
  }
  return {runs:Math.max(0,currentRuns-lastWicketRuns),balls};
}


function clamp255(v){ return Math.max(0,Math.min(255,Math.round(v))); }
function rgbHex(r,g,b){
  return '#'+[r,g,b].map(v=>clamp255(v).toString(16).padStart(2,'0')).join('');
}
function hexRgb(h){
  h=(h||'#000000').replace('#','');
  if(h.length===3) h=h.split('').map(x=>x+x).join('');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}
function blendHex(a,b,t){
  const A=hexRgb(a), B=hexRgb(b);
  return rgbHex(A[0]*(1-t)+B[0]*t,A[1]*(1-t)+B[1]*t,A[2]*(1-t)+B[2]*t);
}
function contrastText(hex){
  const [r,g,b]=hexRgb(hex);
  const lum=(0.2126*r+0.7152*g+0.0722*b)/255;
  return lum>0.61 ? '#07172c' : '#ffffff';
}
function extractDominantColor(img, fallback='#174d8a'){
  try{
    const c=document.createElement('canvas');
    c.width=48;c.height=48;
    const x=c.getContext('2d',{willReadFrequently:true});
    x.drawImage(img,0,0,48,48);
    const d=x.getImageData(0,0,48,48).data;
    const buckets=new Map();
    for(let i=0;i<d.length;i+=16){
      const r=d[i],g=d[i+1],b=d[i+2],a=d[i+3];
      if(a<170) continue;
      const max=Math.max(r,g,b),min=Math.min(r,g,b);
      if(max>238 && min>228) continue;   // white
      if(max<28) continue;               // near black
      if(max-min<30) continue;           // gray
      const qr=Math.min(255,Math.round(r/32)*32);
      const qg=Math.min(255,Math.round(g/32)*32);
      const qb=Math.min(255,Math.round(b/32)*32);
      const key=`${qr},${qg},${qb}`;
      buckets.set(key,(buckets.get(key)||0)+1);
    }
    let best=null,count=-1;
    for(const [k,v] of buckets){
      if(v>count){best=k;count=v;}
    }
    if(!best) return fallback;
    const [r,g,b]=best.split(',').map(Number);
    let hex=rgbHex(r,g,b);
    // Pull extremes toward a richer broadcast midtone.
    hex=blendHex(hex,'#173f70',0.18);
    return hex;
  }catch(e){ return fallback; }
}
function applyTeamColors(){
  const root=document.documentElement;
  const bat=document.getElementById('batLogo');
  const bowl=document.getElementById('bowlLogo');
  const batColor=extractDominantColor(bat,'#174d8a');
  const bowlColor=extractDominantColor(bowl,'#174d8a');
  root.style.setProperty('--bat-primary',batColor);
  root.style.setProperty('--bat-secondary',blendHex(batColor,'#05172d',0.52));
  root.style.setProperty('--bat-accent',blendHex(batColor,'#ffffff',0.10));
  root.style.setProperty('--bat-text',contrastText(batColor));
  root.style.setProperty('--bowl-primary',bowlColor);
  root.style.setProperty('--bowl-text',contrastText(bowlColor));
}

function render(payload){
  const host=latestMatchHost(payload)||payload;
  const details=parseDetails(host.score_details ?? deepFind(payload,'score_details'));
  const extra=details.extraDetails || host.extraDetails || deepFind(payload,'extraDetails') || {};
  const active=Number(details.activeInnings || host.activeInnings || deepFind(payload,'activeInnings') || 1);
  const i1=details.inning1||{};
  const i2=details.inning2||{};
  const activeInn=details[`inning${active}`]||{};

  const team1=extra.team1 || i1.teamName || 'Team 1';
  const team2=extra.team2 || i2.teamName || 'Team 2';
  const battingTeam = active===1 ? team1 : team2;
  const bowlingTeam = active===1 ? team2 : team1;

  const batLogoPath = active===1 ? extra.team1Logo : extra.team2Logo;
  const bowlLogoPath = active===1 ? extra.team2Logo : extra.team1Logo;

  const batImg=document.getElementById('batLogo');
  const bowlImg=document.getElementById('bowlLogo');
  batImg.onload=applyTeamColors;
  bowlImg.onload=applyTeamColors;
  batImg.src=logoUrl(batLogoPath||'');
  bowlImg.src=logoUrl(bowlLogoPath||'');
  document.getElementById('batLogo').style.display=batLogoPath?'block':'none';
  document.getElementById('bowlLogo').style.display=bowlLogoPath?'block':'none';

  const b1=activeInn.batter1||{};
  const b2=activeInn.batter2||{};
  document.getElementById('b1name').textContent = cleanName(b1.name)||'Batter 1';
  document.getElementById('b2name').textContent = cleanName(b2.name)||'Batter 2';
  document.getElementById('b1stat').textContent = `${b1.run??0}${b1.onStrike?'*':''} (${b1.ball??0})`;
  document.getElementById('b2stat').textContent = `${b2.run??0}${b2.onStrike?'*':''} (${b2.ball??0})`;
  document.getElementById('battingTeamLabel').textContent = battingTeam;

  const bow=activeInn.bowler||{};
  document.getElementById('bowlerName').textContent = cleanName(bow.name)||'Bowler';
  document.getElementById('bowlerStat').textContent = bow.name
    ? `${bow.wicket??0}/${bow.run??0} (${bow.over??0})`
    : '—';
  document.getElementById('bowlingTeamLabel').textContent = bowlingTeam;

  document.getElementById('teamShort').textContent=abbrev(battingTeam);
  document.getElementById('mainScore').textContent=`${activeInn.runs??0}/${activeInn.wickets??0}`;
  document.getElementById('mainOvers').textContent=`OVERS ${activeInn.overs??0}`;
  document.getElementById('crr').textContent=`CRR ${activeInn.runRate ?? '—'}`;

  // EXTRAS: DCL score_details uses activeInn.extra (singular).
  const ex = activeInn.extra || {};
  const wd = Number(ex.wide ?? ex.wides ?? ex.wd ?? 0);
  const nb = Number(ex.noBall ?? ex.noBalls ?? ex.nb ?? 0);
  const by = Number(ex.byes ?? ex.bye ?? ex.b ?? 0);
  const lb = Number(ex.lb ?? ex.legByes ?? ex.legbyes ?? 0);
  const exTotal = Number(ex.total ?? (wd + nb + by + lb));
  document.getElementById('extrasInfo').textContent =
    `EXTRAS ${exTotal} • WD ${wd} NB ${nb} B ${by} LB ${lb}`;

  // CURRENT PARTNERSHIP: use an explicit DCL partnership field if present;
  // otherwise derive it from the current innings event history.
  const cpObj = activeInn.currentPartnership || activeInn.partnership || {};
  let cpRuns = cpObj.runs ?? cpObj.run ?? cpObj.partnershipRuns ?? null;
  let cpBalls = cpObj.balls ?? cpObj.ball ?? cpObj.partnershipBalls ?? null;

  if (cpRuns === null || cpBalls === null) {
    const cp = currentPartnership(activeInn);
    cpRuns = cp.runs;
    cpBalls = cp.balls;
  }

  document.getElementById('partnershipInfo').textContent =
    `Current Partnership ${cpRuns} runs in ${cpBalls} balls`;

  const balls=document.getElementById('balls');
  balls.innerHTML='';
  const stack=activeInn.currentRunStack||[];
  stack.slice(-8).forEach(v=>{
    const el=document.createElement('span');
    el.className=ballClass(v);
    el.textContent=String(v).toUpperCase();
    balls.appendChild(el);
  });
  if(!stack.length) balls.textContent='—';

  const ctx=document.getElementById('inningsContext');
  const eq=document.getElementById('equation');
  const rrr=document.getElementById('rrr');

  const matchEnded = details.isMatchEnded ?? host.isMatchEnded ?? deepFind(payload,'isMatchEnded');
  const live = details.isLive ?? host.isLive ?? deepFind(payload,'isLive');

  if(active===1){
    ctx.textContent='';
    eq.textContent=`${bowlingTeam.toUpperCase()} BOWLING`;
    rrr.textContent='RRR —';
  } else {
    const target=(i1.runs??0)+1;
    const current=i2.runs??0;
    const need=Math.max(0,target-current);
    const left=ballsRemaining(i2.overs,20);
    const calcRrr=(left>0 && need>0)?(need/(left/6)).toFixed(2):'—';
    ctx.textContent='';
    eq.textContent = extra.message || `TARGET ${target} • NEED ${need} FROM ${left} BALLS`;
    rrr.textContent=`RRR ${calcRrr}`;
  }

  if(matchEnded){
    eq.textContent=extra.message || 'MATCH COMPLETE';
  } else if(!live && extra.message){
    eq.textContent=extra.message;
  }

  document.getElementById('err').style.display='none';
}

async function load(){
  try{
    const r=await fetch(apiUrl,{cache:'no-store'});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    render(await r.json());
  }catch(e){
    const er=document.getElementById('err');
    er.style.display='block';
    er.textContent='Unable to load DCL score: '+e.message;
  }
}
load();
setInterval(load,refreshMs);
</script>
</body>
</html>
